name: phonespecs
description: Beginner-friendly smartphone specs and comparison app for Apple, Samsung, and Google.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/play_store.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
 
flutter:
  uses-material-design: true
  assets:
    - assets/phones.json
    - assets/images/app_logo.png
    - assets/images/play_store.png